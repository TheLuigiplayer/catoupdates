<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cast Away - The Oddysee</title>
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <link rel="icon" type="image/png" href="favicons/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="favicons/mstile-144x144.png">
    <style>
        :root {
            --bg-top: #0B1026;
            --bg-bottom: #070B1D;
            --card: #141B3D;
            --card-light: #1B2450;
            --stroke: #2A3563;
            --gold: #F5B301;
            --blue: #3B82F6;
            --blue-hover: #60A5FA;
            --text: #E8ECFF;
            --muted: rgba(255, 255, 255, 0.65);
            --radius: 14px;
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            color: var(--text);
            background: linear-gradient(var(--bg-top), var(--bg-bottom)) fixed;
            font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
        .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
        .page-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 16px; }
        .page-head .game { color: var(--gold); font-weight: 600; }
        .page-head .rest { color: var(--muted); font-size: 14px; }

        .post {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .post h2 { margin: 0 0 6px; font-size: 21px; font-weight: 600; color: #fff; line-height: 1.35; }
        .post h2 .version { color: var(--gold); }
        .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
        .chip {
            border: 1px solid var(--stroke);
            background: var(--card-light);
            border-radius: 8px;
            padding: 1px 8px;
            font-size: 12px;
            color: var(--text);
        }
        .post img { display: block; width: 100%; border: 1px solid var(--stroke); border-radius: 12px; margin: 0 0 14px; }
        .video { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 0 0 14px; border: 1px solid var(--stroke); border-radius: 12px; overflow: hidden; }
        .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .post a { color: var(--blue); text-decoration: none; }
        .post a:hover { color: var(--blue-hover); text-decoration: underline; }
        .post ul { margin: 0 0 12px; padding-left: 22px; }
        .post ul li { margin: 2px 0; }
        .post li::marker { color: var(--blue); }
        .post p { margin: 0 0 12px; }
        .post .body > :last-child { margin-bottom: 0; }

        .notice {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius);
            padding: 16px 20px;
            color: var(--muted);
        }

        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-top); }
        ::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 6px; border: 3px solid var(--bg-top); }
        ::-webkit-scrollbar-thumb:hover { background: #3B4A7E; }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="page-head">
            <span class="game">Cast Away - The Oddysee</span>
            <span class="rest">Neuigkeiten</span>
        </header>
        <div id="feed"><div class="notice">Lade Neuigkeiten…</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
    <script>
        const POSTS_DIR = "Posts/";
        const TYPE_LABELS = { update: "Update", stream: "Stream", launcher: "Launcher" };

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function parseFrontMatter(text) {
            const match = text.match(/^\uFEFF?---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (!match) return { fields: {}, body: text };
            const fields = {};
            for (const line of match[1].split(/\r?\n/)) {
                const index = line.indexOf(":");
                if (index <= 0) continue;
                fields[line.slice(0, index).trim().toLowerCase()] = line.slice(index + 1).trim();
            }
            return { fields, body: text.slice(match[0].length) };
        }

        function formatDate(iso) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso ?? "");
            return match ? match[3] + "." + match[2] + "." + match[1] : "";
        }

        function titleHtml(title, version) {
            const escaped = escapeHtml(title);
            if (!version) return escaped;
            const gold = escapeHtml(version);
            const index = escaped.indexOf(gold);
            if (index < 0) return escaped;
            return escaped.slice(0, index) + '<span class="version">' + gold + "</span>" + escaped.slice(index + gold.length);
        }

        function linkifyNewTab(html) {
            return html.replace(/<a href="(https?:[^"]*)"/g, '<a href="$1" target="_blank" rel="noopener"');
        }

        function postHtml(post) {
            const parts = ['<article class="post">'];
            parts.push("<h2>" + titleHtml(post.fields.title, post.fields.version) + "</h2>");

            const metaText = [post.fields.author, formatDate(post.fields.date)]
                .filter(Boolean).map(escapeHtml).join(" · ");
            const typeLabel = TYPE_LABELS[post.fields.type] ?? "Update";
            parts.push('<div class="meta"><span>' + metaText + '</span><span class="chip">' + typeLabel + "</span></div>");

            if (post.fields.image)
                parts.push('<img src="' + escapeHtml(post.fields.image) + '" alt="' + escapeHtml(post.fields.title) + '" loading="lazy">');

            if (post.fields.video)
                parts.push('<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' +
                    encodeURIComponent(post.fields.video) +
                    '" title="YouTube-Video" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>');

            if (post.body.trim())
                parts.push('<div class="body">' + linkifyNewTab(marked.parse(post.body)) + "</div>");

            parts.push("</article>");
            return parts.join("");
        }

        async function loadFeed() {
            const feed = document.getElementById("feed");
            try {
                const indexResponse = await fetch(POSTS_DIR + "index.json", { cache: "no-cache" });
                if (!indexResponse.ok) throw new Error("HTTP " + indexResponse.status);
                const files = await indexResponse.json();

                const posts = await Promise.all(files.map(async (file) => {
                    try {
                        const response = await fetch(POSTS_DIR + file, { cache: "no-cache" });
                        if (!response.ok) return null;
                        return parseFrontMatter(await response.text());
                    } catch {
                        return null;
                    }
                }));

                const html = posts.filter(Boolean).map(postHtml).join("");
                feed.innerHTML = html || '<div class="notice">Noch keine Neuigkeiten vorhanden.</div>';
            } catch {
                feed.innerHTML = '<div class="notice">Neuigkeiten konnten nicht geladen werden. Bitte lade die Seite neu.<br>' +
                    '<span style="font-size: 12px; opacity: .7;">(Hinweis: Beim Öffnen als lokale Datei blockieren Browser das Nachladen der Posts.)</span></div>';
            }
        }

        loadFeed();
    </script>
</body>
</html>
